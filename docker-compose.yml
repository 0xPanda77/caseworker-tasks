services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the tasks_test database used by integration tests (DATABASE_URL_TEST).
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tasks']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/tasks
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    environment:
      PORT: 3100
      API_URL: http://api:4000
    ports:
      - '3100:3100'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
